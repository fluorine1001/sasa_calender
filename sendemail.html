<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이메일 발송 시스템</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("Ob9J4BUU-6hbHVVdi");
        })();
    </script>
</head>
<body>

    <button onclick="sendMyEmail()">이메일 발송하기</button>

    <script type="text/javascript">
        function sendMyEmail() {
            emailjs.send("service_ivozeyc", "template_705rd8n", {
                message: "요청하신 이메일이 정상적으로 발송되었습니다.",
                email: "cylee080607@gmail.com", 
            })
            .then(function(response) {
               alert("이메일 전송이 완료되었습니다.");
            }, function(error) {
               alert("이메일 전송 실패. 네트워크 상태나 코드를 확인해주세요.");
            });
        }
    </script>

</body>
</html>
